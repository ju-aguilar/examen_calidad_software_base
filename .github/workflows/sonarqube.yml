name: Build and SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-analyze:
    name: Build and Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0 # Requerido por SonarQube para el análisis de culpa (blame)

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13.5" # Usa la misma versión que en tu entorno local

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=inventario --cov-report=xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=ju-aguilar_gestión-productos
            -Dsonar.organization=ju-aguilar
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.sources=inventario
            -Dsonar.tests=tests
